
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SnippetShare</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 4px 20px #17255415;
        }

        h1 { color: #172554; margin-top: 0; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; }

        #message { line-height: 1.5; overflow-wrap: anywhere; }
        a { color: #2563eb; }
        .links { margin-top: 20px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome back</h1>
        <p>Log in to SnippetShare.</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                required
                autocomplete="username"
                placeholder="Enter your username">

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="Enter your password">

            <button type="submit" id="loginButton">Log in</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <div class="links">
            Don't have an account? <a href="/register.html">Create one</a>
            <p><a href="/">Back to SnippetShare</a></p>
        </div>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            button.disabled = true;
            message.textContent = "Checking login...";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Login failed.");
                }

                message.textContent = "Login successful! Opening SnippetShare...";

                window.location.href = "/";
            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
