
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Snippet | SnippetShare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f3f6fb;
            color: #172033;
        }

        a { color: #2563eb; }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p><a href="/">← Back to SnippetShare</a></p>

    <main class="card">
        <h1 id="title">Loading snippet...</h1>
        <p id="language"></p>
        <pre id="code"></pre>
        <button id="copyButton" hidden>Copy code</button>
        <p id="message" role="status"></p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const message = document.getElementById("message");
        let snippetCode = "";

        async function loadSnippet() {
            if (!id || !/^\d+$/.test(id)) {
                document.getElementById("title").textContent =
                    "Invalid snippet link";
                document.getElementById("code").textContent = "";
                return;
            }

            try {
                const response = await fetch(
                    "/api/snippets/" + encodeURIComponent(id)
                );

                if (!response.ok) {
                    throw new Error(
                        response.status === 404
                            ? "Snippet not found."
                            : "Could not load snippet."
                    );
                }

                const snippet = await response.json();

                document.title = snippet.title + " | SnippetShare";
                document.getElementById("title").textContent = snippet.title;
                document.getElementById("language").textContent =
                    "Language: " + snippet.language;
                document.getElementById("code").textContent = snippet.code;

                snippetCode = snippet.code;
                document.getElementById("copyButton").hidden = false;
            } catch (error) {
                document.getElementById("title").textContent =
                    "Unable to load snippet";
                document.getElementById("code").textContent = error.message;
            }
        }

        document.getElementById("copyButton").addEventListener(
            "click", async () => {
                try {
                    await navigator.clipboard.writeText(snippetCode);
                    message.textContent = "Code copied!";
                } catch {
                    message.textContent =
                        "Copy failed. Please copy the code manually.";
                }
            }
        );

        loadSnippet();
    </script>
</body>
</html>
