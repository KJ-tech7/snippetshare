
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SnippetShare</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 4px 20px #17255415;
        }

        h1 { margin-top: 0; color: #172554; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; }

        #message {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .links { margin-top: 20px; }

        a { color: #2563eb; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Create your account</h1>
        <p>Join SnippetShare to organize your code snippets.</p>

        <form id="registerForm">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                required
                minlength="3"
                maxlength="50"
                pattern="[A-Za-z0-9_]{3,50}"
                autocomplete="username"
                placeholder="Choose a username"
            >

            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                required
                maxlength="150"
                autocomplete="email"
                placeholder="you@example.com"
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                required
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                placeholder="At least 8 characters"
            >

            <button type="submit" id="registerButton">
                Create account
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <div class="links">
            Already registered? <a href="/login.html">Log in</a>
            <p><a href="/">Back to SnippetShare</a></p>
        </div>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async event => {
            event.preventDefault();
            button.disabled = true;
            message.textContent = "Creating your account...";

            const payload = {
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Registration failed."
                    );
                }

                message.textContent =
                    "Account created successfully! You can now log in.";
                form.reset();

                const loginLink = document.createElement("a");
                loginLink.href = "/login.html";
                loginLink.textContent = " Go to login";
                message.appendChild(loginLink);

            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
